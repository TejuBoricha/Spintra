name: 🐛 Bug Report
description: Report a bug, crash, or unexpected behavior in Spintra
title: "fix: [Short description of issue]"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues before submitting.
  - type: input
    id: environment
    attributes:
      label: Environment & Browser
      description: What browser, device, and operating system did you experience this on?
      placeholder: e.g., Chrome 130 on Windows 11 / Safari on iOS 18
    validations:
      required: true
  - type: dropdown
    id: activity
    attributes:
      label: Affected Component or Activity
      options:
        - "Spintra City Board Game"
        - "Multiplayer Rooms (Chat, Presence, Host Migration)"
        - "Tournament Bracket Engine"
        - "Bingo / Trivia"
        - "Lucky Wheel 3D / Dice / Coin Flip"
        - "Classroom / Team Maker / Name Draw"
        - "Other Tool / UI"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear, step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '/tools/...' or create a room
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Screenshots
      description: Attach screenshots, console logs, or network errors if available.
