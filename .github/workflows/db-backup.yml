name: Daily Database Backup

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {}

env:
  PGDUMP_VERSION: "16"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install pg_dump
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-${{ env.PGDUMP_VERSION }}

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FILENAME="spintra_backup_${TIMESTAMP}.sql.gz"
          pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            | gzip > "$FILENAME"
          echo "BACKUP_FILE=$FILENAME" >> "$GITHUB_ENV"

      - name: Upload to R2
        if: env.BACKUP_FILE != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BACKUP_SECRET_ACCESS_KEY }}
          # R2 is S3-API-compatible but isn't AWS — "auto" is Cloudflare's
          # documented region value for the S3 client's request signing,
          # and the bucket lives at a per-account R2 endpoint, not a real
          # AWS region endpoint.
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: ${{ secrets.AWS_BACKUP_R2_ENDPOINT }}
          S3_BUCKET: ${{ secrets.AWS_BACKUP_S3_BUCKET }}
        run: |
          # No --storage-class: STANDARD_IA is AWS-specific terminology R2
          # doesn't recognize the same way. The bucket's own default
          # storage class (Standard) already applies.
          aws s3 cp "$BACKUP_FILE" "s3://${S3_BUCKET}/spintra-db-backups/${BACKUP_FILE}"

      - name: Cleanup
        if: always()
        run: rm -f spintra_backup_*.sql.gz
