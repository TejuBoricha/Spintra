name: Daily Database Backup

# Audit P-1 / P-5 (2026-09-26). The previous job ran one whole-database
# pg_dump (--clean --if-exists, every schema including Supabase-managed
# ones). Restored the only way hosted Supabase allows (as the non-superuser
# postgres role), that dump reported success while leaving every public
# table EMPTY, and it was never restore-tested. It also uploaded auth
# sessions and refresh tokens unencrypted.
#
# Now, following Supabase's documented method
# (https://supabase.com/docs/guides/platform/migrating-within-supabase/backup-restore):
#   roles.sql   cluster roles (applied best-effort: on Supabase it only
#               holds settings for Supabase's own roles, some of which only
#               Supabase can apply)
#   schema.sql  public schema: tables, functions, triggers, policies
#   data.sql    rows from public and auth, without auth.sessions and
#               auth.refresh_tokens (a restore signs everyone out, which is
#               fine; keeping live login tokens in backups is not)
#   extras.sql  what `db dump` leaves out but the app needs: the RLS
#               policies on realtime.messages (private room channels) and
#               pg_cron jobs, generated by scripts/backup/extras.sql
# Every backup is then restored into an empty local Supabase stack and
# checked before upload, and uploaded encrypted. The three dumps are
# separate pg_dump runs (separate snapshots); a migration landing between
# them could make the set inconsistent, which the restore check catches. The restore steps are in
# docs/ARCHITECTURE.md, "Backup & Disaster Recovery".

on:
  schedule:
    # 03:00 UTC is when it's queued; GitHub often starts scheduled jobs
    # hours late (observed 07:45-09:52 UTC).
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  # Must match (or exceed) the live project's Postgres major version for
  # psql; `supabase db dump` brings its own pg_dump. Check the live version
  # (`supabase projects list`, postgres_engine) before changing.
  PG_VERSION: "17"
  # Not pinned, unlike ci.yml: the CLI version decides the local stack's
  # auth (GoTrue) image, and the restore check COPYs production's auth rows
  # into it. A pinned CLI would fall behind hosted Supabase's auth schema
  # and start failing the restore for no fault of the backup.
  SUPABASE_CLI_VERSION: "latest"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          # ubuntu-latest's default apt repos don't carry postgresql-client-17;
          # it needs the official PostgreSQL APT repo.
          set -euo pipefail
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-${{ env.PG_VERSION }}
          # Installing the versioned client doesn't repoint /usr/bin/psql.
          echo "/usr/lib/postgresql/${{ env.PG_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Dump roles, schema, data and extras
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          echo "BACKUP_TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          # Counted just before the data dump, so the dump can only have the
          # same or more rows (users only grow); the restore check relies on it.
          psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c \
            "select (select count(*) from auth.users) || ' ' || (select count(*) from public.trivia_questions)" \
            > backup/source-counts.txt
          supabase db dump --db-url "$DATABASE_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$DATABASE_URL" -f backup/schema.sql
          # Login state stays out of backups: sessions, refresh tokens,
          # one-time (recovery/email) tokens, OAuth flow state and MFA
          # challenge/claim rows (the claims reference sessions).
          supabase db dump --db-url "$DATABASE_URL" -f backup/data.sql --use-copy --data-only \
            -s public,auth \
            -x auth.sessions -x auth.refresh_tokens -x auth.one_time_tokens \
            -x auth.flow_state -x auth.mfa_challenges -x auth.mfa_amr_claims
          psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -f scripts/backup/extras.sql > backup/extras.sql
          # A schema this size is never tiny; a near-empty file means the
          # dump pointed somewhere wrong.
          for f in schema data; do
            size=$(stat -c%s "backup/$f.sql")
            if [ "$size" -lt 10000 ]; then
              echo "::error::backup/$f.sql is only $size bytes; refusing to continue."
              exit 1
            fi
          done
          ls -la backup

      - name: Restore into an empty Supabase stack and check it
        id: restore_check
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restore" && cd "$RUNNER_TEMP/restore"
          supabase init --force >/dev/null
          supabase start -x studio,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta,imgproxy
          TARGET="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          B="$GITHUB_WORKSPACE/backup"
          # Best-effort: see roles.sql above.
          psql "$TARGET" -q -f "$B/roles.sql" || echo "::notice::roles.sql had errors (expected for Supabase-managed role settings)"
          # Strict: any error aborts and fails the check.
          psql "$TARGET" --single-transaction -v ON_ERROR_STOP=1 -q \
            -f "$B/schema.sql" \
            -c "SET session_replication_role = replica" \
            -f "$B/data.sql" > /dev/null
          psql "$TARGET" -v ON_ERROR_STOP=1 -q -f "$B/extras.sql" > /dev/null
          read -r SRC_USERS SRC_TRIVIA < "$B/source-counts.txt"
          read -r USERS TRIVIA REALTIME_POLICIES CRON_JOBS PUBLIC_POLICIES RLS < <(psql "$TARGET" -At -F ' ' -c "
            select (select count(*) from auth.users),
                   (select count(*) from public.trivia_questions),
                   (select count(*) from pg_policies where schemaname = 'realtime'),
                   (select count(*) from cron.job),
                   (select count(*) from pg_policies where schemaname = 'public'),
                   (select relrowsecurity from pg_class where oid = 'realtime.messages'::regclass)")
          echo "restored: users=$USERS/$SRC_USERS trivia=$TRIVIA/$SRC_TRIVIA realtime_policies=$REALTIME_POLICIES cron_jobs=$CRON_JOBS public_policies=$PUBLIC_POLICIES realtime_rls=$RLS"
          fail=0
          [ "$TRIVIA" -eq "$SRC_TRIVIA" ] && [ "$TRIVIA" -gt 0 ] || { echo "::error::trivia_questions restored $TRIVIA of $SRC_TRIVIA"; fail=1; }
          # Counted before the dump, and users only grow.
          [ "$USERS" -ge "$SRC_USERS" ] || { echo "::error::auth.users restored $USERS of $SRC_USERS"; fail=1; }
          [ "$REALTIME_POLICIES" -ge 2 ] || { echo "::error::realtime.messages policies missing after restore"; fail=1; }
          [ "$CRON_JOBS" -ge 1 ] || { echo "::error::pg_cron jobs missing after restore"; fail=1; }
          [ "$PUBLIC_POLICIES" -ge 20 ] || { echo "::error::only $PUBLIC_POLICIES public RLS policies after restore"; fail=1; }
          [ "$RLS" = "t" ] || { echo "::error::RLS is off on realtime.messages after restore"; fail=1; }
          exit $fail

      - name: Package and encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          TIMESTAMP="$BACKUP_TIMESTAMP"
          tar -czf "spintra_backup_${TIMESTAMP}.tar.gz" -C backup roles.sql schema.sql data.sql extras.sql source-counts.txt
          if [ -n "${BACKUP_PASSPHRASE:-}" ]; then
            gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
              --passphrase-fd 0 --output "spintra_backup_${TIMESTAMP}.tar.gz.gpg" \
              "spintra_backup_${TIMESTAMP}.tar.gz" <<< "$BACKUP_PASSPHRASE"
            rm -f "spintra_backup_${TIMESTAMP}.tar.gz"
            echo "BACKUP_FILE=spintra_backup_${TIMESTAMP}.tar.gz.gpg" >> "$GITHUB_ENV"
          else
            # Still upload (an unencrypted backup beats none), but the job
            # fails at the end: this isn't optional configuration.
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE is not set, so this backup is uploaded UNENCRYPTED. Add the secret."
            echo "BACKUP_FILE=spintra_backup_${TIMESTAMP}.tar.gz" >> "$GITHUB_ENV"
            echo "BACKUP_UNENCRYPTED=1" >> "$GITHUB_ENV"
          fi

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BACKUP_SECRET_ACCESS_KEY }}
          # R2 is S3-API-compatible; "auto" is Cloudflare's documented region
          # value, and the bucket lives at a per-account R2 endpoint.
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: ${{ secrets.AWS_BACKUP_R2_ENDPOINT }}
          S3_BUCKET: ${{ secrets.AWS_BACKUP_S3_BUCKET }}
        run: aws s3 cp "$BACKUP_FILE" "s3://${S3_BUCKET}/spintra-db-backups/${BACKUP_FILE}"

      - name: Fail if the restore check failed
        if: steps.restore_check.outcome != 'success'
        run: |
          echo "::error::The backup was uploaded, but restoring it into an empty stack failed its checks. Treat it as unverified and investigate."
          exit 1

      - name: Fail if the backup is unencrypted
        if: env.BACKUP_UNENCRYPTED == '1'
        run: |
          echo "::error::Uploaded unencrypted. Add the BACKUP_ENCRYPTION_PASSPHRASE repo secret."
          exit 1

      - name: Cleanup
        if: always()
        run: |
          rm -rf backup spintra_backup_*
          (cd "$RUNNER_TEMP/restore" 2>/dev/null && supabase stop --no-backup) || true
