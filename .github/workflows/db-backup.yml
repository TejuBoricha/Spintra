name: Daily Database Backup

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {}

env:
  # Must match (or exceed) the live Supabase project's Postgres version —
  # pg_dump refuses to dump from a newer server than itself. Found via a
  # live run: this was pinned to 16 while the project runs Postgres 17.6,
  # so pg_dump aborted immediately on every single run with "aborting
  # because of server version mismatch" — silently, because see the
  # pipefail note below. Verify the live version before ever changing
  # this: `supabase projects list` (postgres_engine field), or the
  # Database section of the Supabase dashboard.
  PGDUMP_VERSION: "17"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install pg_dump
        run: |
          # ubuntu-latest's default apt repos don't carry postgresql-client-17
          # ("Unable to locate package") — confirmed live, this is what
          # actually failed on the first run after bumping PGDUMP_VERSION.
          # Newer major versions need the official PostgreSQL APT repo.
          set -euo pipefail
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-${{ env.PGDUMP_VERSION }}

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # set -o pipefail: without it (GitHub Actions' bash default is
          # only `-e`, confirmed live in a run's own logs), a failing
          # pg_dump whose stderr goes to the terminal but whose stdout is
          # piped into gzip does NOT fail this step — gzip happily
          # compresses zero bytes into a small-but-"valid" .gz file, the
          # step exits 0, and the job reports success. This is exactly
          # what happened with the version mismatch above: a ~20-byte
          # "backup" silently uploaded on every run, until checked by
          # hand. pipefail makes pg_dump's own exit code the one that
          # actually matters.
          set -euo pipefail
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FILENAME="spintra_backup_${TIMESTAMP}.sql.gz"
          # Bare `pg_dump` still resolves to ubuntu-latest's pre-installed
          # v16, not the v17 the previous step just apt-installed — found
          # live: installing postgresql-client-17 doesn't repoint /usr/bin/
          # pg_dump, it just adds /usr/lib/postgresql/17/bin/pg_dump
          # alongside the existing v16 one. Invoking the versioned path
          # directly removes the ambiguity instead of depending on
          # update-alternatives having done what we'd want here.
          "/usr/lib/postgresql/${{ env.PGDUMP_VERSION }}/bin/pg_dump" "$DATABASE_URL" \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            | gzip > "$FILENAME"
          # Second, independent line of defense: even a *successful*
          # pg_dump of a genuinely empty/near-empty database would be
          # unusual for this schema (61+ migrations of tables/functions/
          # policies) — a suspiciously small archive is worth failing
          # loudly on rather than silently accepting, since pipefail only
          # catches a pg_dump that actually exits non-zero, not one that
          # succeeds while dumping far less than expected for some other
          # reason (e.g. a bad connection string pointed at an empty DB).
          MIN_BYTES=2048
          ACTUAL_BYTES=$(stat -c%s "$FILENAME")
          if [ "$ACTUAL_BYTES" -lt "$MIN_BYTES" ]; then
            echo "::error::Backup file is only ${ACTUAL_BYTES} bytes (expected at least ${MIN_BYTES}) — refusing to upload a suspiciously small backup."
            exit 1
          fi
          echo "BACKUP_FILE=$FILENAME" >> "$GITHUB_ENV"

      - name: Upload to R2
        if: env.BACKUP_FILE != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BACKUP_SECRET_ACCESS_KEY }}
          # R2 is S3-API-compatible but isn't AWS — "auto" is Cloudflare's
          # documented region value for the S3 client's request signing,
          # and the bucket lives at a per-account R2 endpoint, not a real
          # AWS region endpoint.
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: ${{ secrets.AWS_BACKUP_R2_ENDPOINT }}
          S3_BUCKET: ${{ secrets.AWS_BACKUP_S3_BUCKET }}
        run: |
          # No --storage-class: STANDARD_IA is AWS-specific terminology R2
          # doesn't recognize the same way. The bucket's own default
          # storage class (Standard) already applies.
          aws s3 cp "$BACKUP_FILE" "s3://${S3_BUCKET}/spintra-db-backups/${BACKUP_FILE}"

      - name: Cleanup
        if: always()
        run: rm -f spintra_backup_*.sql.gz
