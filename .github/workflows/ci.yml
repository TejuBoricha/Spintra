name: Spintra Continuous Integration

on:
  # One run per pull request head. A pull_request run tests the merge of the branch into its base (that merge is
  # what lands), so a push run on the same branch only added a second, less accurate copy of the whole pipeline
  # to every push. `main` still runs after each merge. A branch without a pull request runs nothing: push work in
  # progress freely. (ADR-013)
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

# A newer push to a pull request replaces the run in progress, since nobody reads the older result. Every push to
# main is its own group (its commit), so a quick series of merges is never collapsed: GitHub also cancels a run that
# is only queued when a newer one joins the same group, which would leave a merge commit on main without a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Enterprise security principle of least privilege: default GITHUB_TOKEN has read-only repository permissions.
permissions:
  contents: read

jobs:
  # Standalone fast-fail static analysis & security gate (runs in ~40 seconds).
  # Catches lint, typecheck, doc drift, and security advisories immediately,
  # preventing 6 heavier test runners from starting or building if fundamentals fail.
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Strict Dependency Security Audit
        run: npm run audit # Block build on moderate, high, or critical vulnerability findings

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: Static Analysis Linting
        run: npm run lint

      - name: Documentation Drift Check
        run: npm run docs:check

  validate-shard:
    name: validate-shard (${{ matrix.shard }})
    needs: [quality-gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Resolve Playwright Version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium & Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright System Dependencies (if cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Restore Next.js Build Cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      # This job deliberately builds/runs without Supabase env vars to
      # exercise the app's demo-mode/BroadcastChannel fallback path (see
      # the db-integration job's comment below for why a *separate* job
      # covers the real-Supabase path instead). SKIP_ENV_VALIDATION opts
      # out of next.config.ts's fail-fast check for that one intentional
      # case only.
      - name: Production Build Validation
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Execute Playwright E2E Smoke Tests
        run: npx playwright test --shard=${{ matrix.shard }}
        env:
          SKIP_ENV_VALIDATION: "true"
          PLAYWRIGHT_WORKERS: "2"

      - name: Upload Test Artifacts on Failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-shard-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  validate:
    name: validate
    needs: [quality-gate, validate-shard]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    steps:
      - name: Evaluate Shard Results
        run: |
          if [ "${{ needs.quality-gate.result }}" != "success" ] || [ "${{ needs.validate-shard.result }}" != "success" ]; then
            echo "::error::Quality gate or one or more validate shards failed."
            exit 1
          fi
          echo "All quality gate and validate shards passed successfully."

  # Spins up an ephemeral, local Supabase stack (Docker, via Supabase CLI —
  # no secrets, no connection to live project), applies every migration fresh,
  # executes the direct Postgres RPC Spintra City regression suite, builds against
  # real Supabase credentials, and runs real database, RLS, auth, and multiplayer E2E suites.
  db-integration-shard:
    name: db-integration-shard (${{ matrix.shard }})
    needs: [quality-gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.0

      - name: Start Ephemeral Local Supabase Stack
        run: supabase start

      - name: Apply All Migrations Fresh
        run: supabase db reset

      # Direct-RPC correctness proof for Spintra City (57 cases mapped to
      # the QA audit's bug IDs, incl. the overload-ambiguity/grant-hygiene
      # regression checks built after migration 0091's bug) — talks
      # straight to Postgres, no app build or browser needed.
      - name: Spintra City DB Regression Suite
        run: npm run test:city-regression

      - name: Export Local Supabase Credentials for the App Build
        run: |
          supabase status -o env > /tmp/supabase-status.env
          URL=$(grep '^API_URL=' /tmp/supabase-status.env | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//')
          ANON_KEY=$(grep '^ANON_KEY=' /tmp/supabase-status.env | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//')
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Resolve Playwright Version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium & Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright System Dependencies (if cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Restore Next.js Build Cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-db-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-db-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-db-

      - name: Production Build Against Real Local Supabase Instance
        run: npm run build

      # Run ONLY the database, multiplayer, auth, and room integration tests against Supabase
      # (123 tests across 44 files), split evenly across 2 shards (~60 tests each).
      # Pure static UI/visual/layout tests belong in validate-shard, not here.
      - name: Execute E2E Tests Against Real RLS/Triggers/Realtime
        run: npx playwright test "tests/(qa-x.*|city-lobby|multiplayer-loop|room-join-errors|smoke|tournament-ties|tournament-rescore|trivia-award-idempotency)\.spec\.ts" --shard=${{ matrix.shard }}
        env:
          PLAYWRIGHT_WORKERS: "2"

      - name: Upload Test Artifacts on Failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: db-integration-playwright-report-shard-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

      - name: Stop Local Supabase Stack
        if: always()
        run: supabase stop

  db-integration:
    name: db-integration
    needs: [quality-gate, db-integration-shard]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    steps:
      - name: Evaluate DB Integration Shard Results
        run: |
          if [ "${{ needs.quality-gate.result }}" != "success" ] || [ "${{ needs.db-integration-shard.result }}" != "success" ]; then
            echo "::error::Quality gate or one or more db-integration shards failed."
            exit 1
          fi
          echo "All quality gate and db-integration shards passed successfully."
